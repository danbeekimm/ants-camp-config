server:
  port: 8083

jwt:
  secret: ${JWT_SECRET}

# allowCredentials=true 라 와일드카드 불가 — 오리진을 명시적으로 나열 (쉼표 구분)
cors:
  allowed-origins: https://app.antscamp.site,http://localhost:8080,http://localhost:3001

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - CustomAuthFilter

        - id: auth-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: competition-service
          uri: lb://COMPETITION-SERVICE
          predicates:
            - Path=/api/competitions/**
          filters:
            - CustomAuthFilter

        - id: ranking-service
          uri: lb://RANKING-SERVICE
          predicates:
            - Path=/api/rankings/**
          filters:
            - CustomAuthFilter

        - id: trade-service
          uri: lb://TRADE-SERVICE
          predicates:
            - Path=/api/trades/**
          filters:
            - CustomAuthFilter

        - id: trade-service-stocks
          uri: lb://TRADE-SERVICE
          predicates:
            - Path=/api/stocks/**
          filters:
            - CustomAuthFilter

        - id: trade-service-market
          uri: lb://TRADE-SERVICE
          predicates:
            - Path=/api/market/**
          filters:
            - CustomAuthFilter

        - id: asset-service
          uri: lb://ASSET-SERVICE
          predicates:
            - Path=/api/assets/**,/api/accounts/**,/api/holdings/**
          filters:
            - CustomAuthFilter

        - id: assistant-service
          uri: lb://ASSISTANT-SERVICE
          predicates:
            - Path=/api/assistants/**
          filters:
            - CustomAuthFilter

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
          filters:
            - CustomAuthFilter

        - id: admin-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/admin/**
          filters:
            - CustomAuthFilter

        - id: trade-service-websocket
          uri: lb:ws://TRADE-SERVICE
          predicates:
            - Path=/ws-stomp/**
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://config-server:8888

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # P50/P95/P99 히스토그램 활성화 (선결조건: 응답시간 메트릭)
      service-level-objectives:      # 히스토그램 버킷 강제 생성
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
